name: Build Mod Menu

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Baixa e instala o NDK manualmente, sem depender da action que deu erro
    - name: Install Android NDK r24
      run: |
        wget --quiet https://dl.google.com/android/repository/android-ndk-r24-linux.zip
        unzip -q android-ndk-r24-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r24" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r24" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mod-menu-apk
        path: app/build/outputs/apk/debug/*.apk
